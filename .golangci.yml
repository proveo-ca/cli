# golangci-lint v2 (Go format + lint) — https://golangci-lint.run/docs/configuration/file/
# Format: `mise run fmt` → golangci-lint fmt
# Lint:  `mise run lint` → gofmt + comment-block contract tests, go vet, golangci-lint run
version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - image
    - e2e

linters:
  # Default set: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - forbidigo
  settings:
    errcheck:
      # CLI / test noise: status lines and best-effort Close are intentional.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (io.Closer).Close
    forbidigo:
      # One identity: colour comes from ui.Theme and ui.Styles (_spec/_conventions/tui-design-language.puml).
      forbid:
        - pattern: ^lipgloss\.Color$
          msg: paint a ui.Tone through ui.Theme or ui.Styles
        - pattern: ^ui\.Identity
          msg: the identity palette is layer 0; paint a ui.Tone
  exclusions:
    rules:
      - path: ^internal/ui/
        linters: [forbidigo]
      - path: _test\.go$
        linters: [forbidigo]
      # colour ban allow-list, mirrored by colourAllowList in internal/contract/tui_identity_test.go
      - path: ^cmd/proveo/help\.go$
        linters: [forbidigo]
      - path: ^internal/choiceui/dialog_run\.go$
        linters: [forbidigo]
      - path: ^internal/dashboard/highlight\.go$
        linters: [forbidigo]
      - path: ^internal/dashboard/items\.go$
        linters: [forbidigo]
      - path: ^internal/dashboard/view\.go$
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/proveo-ca/proveo
