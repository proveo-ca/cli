<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Proveo Dashboard Proposal</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1b1b20;
    --surface: var(--bg);
    --raised: #1c1c21;
    --line: #1c5567;
    --text: #eaf5f3;
    --muted: #8fb9c2;
    --brand: #00bac6;
    --focus: color-mix(in srgb, var(--brand) 9%, var(--surface));
    --attention: #cbdb2a;
    --success: #009532;
    --ink: #181818;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --inset: 12px;
    --window-width: 1160px;
    --window-height: 810px;
    --canvas-width: 1100px;
    font: 14px/1.5 var(--mono);
    color: var(--text);
    background: var(--bg);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: var(--inset); }
  h1, h2, h3, p, ol, ul, dl, dd, pre { margin: 0; font: inherit; }
  button, select, code, kbd { font: inherit; }
  button { color: inherit; cursor: pointer; }
  summary { cursor: pointer; }
  a { color: var(--brand); text-underline-offset: 3px; }
  :focus-visible { outline: 1px solid var(--brand); outline-offset: -1px; }
  [hidden] { display: none !important; }
  .terminal-shell {
    display: flex;
    flex-direction: column;
    width: min(100%, var(--window-width));
    height: min(var(--window-height), calc(100dvh - 2 * var(--inset)));
    min-height: 110px;
    margin: 0 auto;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .terminal-content { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
  .terminal-content > [role="tabpanel"] { min-width: var(--canvas-width); min-height: 100%; }
  #proveo { display: flex; flex-direction: column; }
  #sbx { background: var(--bg); }
  .subtext, .kicker { color: var(--muted); }
  .kicker { font-size: .92rem; }
  .top { background: var(--raised); border-bottom: 1px solid var(--line); }
  .top, .footer { flex: none; overflow-x: auto; white-space: nowrap; }
  .bar, .workbar, .footer { display: flex; align-items: center; gap: 12px; padding: 5px 10px; }
  .bar { min-height: 38px; }
  .brand { font-weight: bold; white-space: nowrap; }
  .mark, .path { color: var(--brand); }
  .tabs, .layout-picker { display: flex; align-items: center; gap: 4px; }
  .tab, .layout-picker button, .button { border: 0; background: transparent; padding: 2px 6px; color: var(--muted); white-space: nowrap; }
  .tab:hover, .layout-picker button:hover, .button:hover { background: var(--raised); color: var(--text); }
  .tab[aria-selected="true"] { background: var(--brand); color: var(--ink); }
  .layout-picker button[aria-pressed="true"] { background: var(--focus); color: var(--text); box-shadow: inset 0 -1px var(--brand); }
  .tab[aria-selected="true"]::before { content: "["; }
  .tab[aria-selected="true"]::after { content: "]"; }
  .switch-hint { margin-left: auto; color: var(--muted); }
  .switch-hint[data-armed="true"] { color: var(--attention); }
  kbd { color: var(--brand); font-weight: bold; }
  .button { text-align: left; color: var(--text); }
  .button.primary { color: var(--brand); }
  .workbar { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 36px; }
  .workbar h1 { font-weight: bold; }
  .path { overflow-wrap: anywhere; }
  .layout-picker { margin-left: auto; }
  .capacity-bar { display: flex; gap: 8px; align-items: center; padding: 4px 10px; border-bottom: 1px solid var(--line); }
  .capacity-meters, .capacity-meter, .capacity-segments { display: flex; align-items: center; }
  .capacity-meters { gap: 2ch; }
  .capacity-meter { gap: .7ch; white-space: nowrap; }
  .capacity-segments { gap: 2px; }
  .capacity-segment { display: flex; block-size: .65em; background: var(--line); }
  .capacity-fill { background: var(--brand); }
  #capacity-summary { margin-left: auto; white-space: nowrap; }
  .grid { display: grid; flex: 1; grid-template-columns: minmax(170px, .58fr) minmax(0, 2fr) minmax(280px, 1.04fr); min-height: 540px; }
  .panel { min-width: 0; }
  .grid > .panel + .panel { border-left: 1px solid var(--line); }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line); background: var(--raised); }
  .panel-head h2 { min-width: 0; font-weight: bold; overflow-wrap: anywhere; }
  #work-toolbar:not(:has(button, #work-legend:not(:empty))) { display: none; }
  #task-controls { margin-left: auto; }
  .panel-body { padding: 7px 10px; }
  .files .panel-body { padding: 5px 6px; }
  #filetree { font-size: .92rem; }
  .tree { list-style: none; padding: 0; }
  .tree .tree { padding-left: .8ch; border-left: 1px solid var(--line); margin-left: 1ch; }
  .tree summary, .file { padding: 3px 5px; width: 100%; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree summary { color: var(--brand); }
  .file { background: transparent; border: 0; display: flex; align-items: baseline; }
  .file::before { content: "·"; color: var(--muted); flex: none; margin-right: 1ch; }
  .change-file::before { content: none; }
  .change-status { flex: 0 0 2ch; color: var(--brand); }
  .change-status[data-status="A"] { color: var(--success); }
  .change-status[data-status="D"] { color: var(--attention); }
  .change-source { padding: 3px 5px 6px; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
  .file:hover { background: var(--raised); }
  .file[aria-current="true"] { background: var(--focus); box-shadow: inset 1px 0 var(--brand); }
  .clipped-label { display: flex; min-width: 0; max-width: 100%; white-space: nowrap; }
  .clipped-prefix { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .clipped-suffix { flex: none; max-width: 90%; overflow: hidden; }
  .section + .section { margin-top: 11px; }
  .section .kicker { display: flex; align-items: center; gap: 1ch; margin: 0 0 4px; color: var(--brand); }
  .section .kicker::after { content: ""; border-top: 1px solid var(--line); flex: 1; }
  .task { min-width: 0; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 1ch; text-align: left; padding: 2px 5px 2px 2.6ch; line-height: 1.35; position: relative; border: 0; background: transparent; }
  .task:hover { background: var(--raised); }
  :is(.task, .graph-node)[aria-pressed="true"] { background: var(--focus); }
  :is(.task, .graph-node)[aria-pressed="true"]::before { content: "›"; position: absolute; color: var(--brand); }
  .task[aria-pressed="true"]::before { left: .8ch; top: 2px; }
  .task-heading, .task-meta { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-heading { font-weight: bold; }
  .task-meta { color: var(--muted); font-size: .88rem; }
  .state { display: inline-flex; align-items: baseline; gap: .6ch; color: var(--muted); font-size: .88rem; }
  .state.review, .state.active { color: var(--brand); }
  .state.warn { color: var(--attention); }
  .task-side { display: grid; justify-items: end; }
  .attach-hint { display: none; color: var(--brand); font-size: .88rem; }
  .task:is(:hover, :focus-visible) .attach-hint { display: block; }
  .graph-row + .graph-row { margin-top: 10px; }
  .graph-chain { display: flex; gap: .6ch; align-items: center; flex-wrap: wrap; }
  .graph-node { position: relative; padding-inline-start: 1.8ch; }
  .graph-node[aria-pressed="true"]::before { left: .5ch; }
  .graph-fold { color: var(--brand); }
  .graph-fold[aria-expanded="true"] { background: var(--raised); }
  .graph-blockers { margin-top: 3px; color: var(--attention); }
  .empty { color: var(--muted); padding: 3px 0; }
  .slot { display: grid; grid-template-columns: 9ch minmax(0, 1fr); align-items: start; gap: 1ch; }
  .slot time { padding-top: 2px; color: var(--muted); }
  .slot .task { grid-column: 2; }
  .inspector h3 { color: var(--brand); font-weight: bold; overflow-wrap: anywhere; }
  .inspector p + p, .inspector h3 + p { margin-top: 4px; }
  .sandbox-usage { padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .sandbox-usage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sandbox-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .sandbox-metrics dt { font-size: .88rem; color: var(--muted); }
  .facts { margin-block: 9px; }
  .fact { display: grid; grid-template-columns: 9ch minmax(0, 1fr); gap: 1ch; align-items: baseline; }
  .fact dt { color: var(--muted); }
  .fact dd { overflow-wrap: anywhere; }
  .file-link { border: 0; background: transparent; color: var(--brand); text-align: left; padding: 0; max-width: 100%; }
  .file-link:hover { color: var(--text); }
  .task-excerpt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
  .last-push { font-size: .88rem; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .file-preview { margin-block: 8px; padding: 6px; background: var(--bg); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .initial-prompt { margin-block: 8px; }
  .initial-prompt summary { color: var(--brand); }
  .prompt-overflow { float: right; }
  .initial-prompt pre { max-block-size: 6lh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .editor-lines { list-style: none; margin-top: 7px; padding: 5px 0; color: var(--text); }
  .editor-lines li { display: grid; grid-template-columns: 5ch minmax(0, 1fr); }
  .editor-lines li > span { padding-right: 2ch; text-align: right; color: var(--muted); user-select: none; }
  .editor-lines code { white-space: pre-wrap; overflow-wrap: anywhere; }
  .patch-line { display: block; }
  .patch-added { color: var(--brand); }
  .patch-removed { color: var(--attention); }
  #proveo[data-layout="combined"][data-mode="dashboard"] .grid {
    grid-template-columns: minmax(320px, 1.15fr) minmax(0, 2fr);
    grid-template-rows: auto 1fr;
    grid-template-areas: "files tasks" "details tasks";
  }
  #proveo[data-layout="combined"][data-mode="dashboard"] .files { grid-area: files; }
  #proveo[data-layout="combined"][data-mode="dashboard"] .task-panel { grid-area: tasks; }
  #proveo[data-layout="combined"][data-mode="dashboard"] .inspector {
    grid-area: details;
    border-left: 0;
    border-top: 1px solid var(--line);
  }
  #proveo[data-mode="editor"] .grid { grid-template-columns: minmax(170px, .58fr) minmax(0, 3.04fr); }
  #proveo[data-mode="editor"] :is(.task-panel, .layout-picker, .capacity-bar),
  #terminal-shell:not([data-mode="editor"]) #editor-keys,
  #terminal-shell[data-mode="editor"] #dashboard-keys,
  #terminal-shell[data-tab="sbx"] :is(#dashboard-keys, #editor-keys, #workspace-note),
  #terminal-shell[data-tab="proveo"] #sbx-source { display: none; }
  #terminal-shell[data-tab="proveo"]:not([data-mode="editor"]) .implementation-prefix { display: none; }
  .sbx-preview { margin: 0; }
  .sbx-preview img { display: block; width: 100%; height: auto; }
  .footer { background: var(--raised); border-top: 1px solid var(--line); min-height: 36px; }
  .footer .button { color: var(--muted); }
  .footer .button:hover { color: var(--text); }
  .keybar { display: flex; align-items: center; gap: 4px 9px; }
  .footer .button, .keybar, #sbx-source { flex: none; }
  .footer-note, .toast { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
  .toast { color: var(--brand); }
  .toast:empty { display: none; }
  .toast:not(:empty) + #workspace-note { display: none; }
  dialog { color: var(--text); background: var(--surface); padding: 0; border: 1px solid var(--brand); width: min(760px, calc(100% - 24px)); }
  dialog::backdrop { background: color-mix(in srgb, var(--bg) 75%, transparent); }
  dialog .panel-body { padding: 10px; }
  dialog .panel-body > * + *, dialog li + li { margin-top: 8px; }
  .launch-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .launch-fields label { display: grid; gap: 4px; min-width: 0; color: var(--muted); }
  .launch-fields :is(select, input) { color: var(--text); background: var(--raised); width: 100%; border: 1px solid var(--line); border-radius: 0; padding: 4px; font: inherit; }
  .prompt-field { display: grid; gap: 5px; color: var(--muted); }
  .prompt-field textarea { width: 100%; min-block-size: 8em; resize: vertical; padding: 6px; color: var(--text); background: var(--bg); border: 1px solid var(--line); font: inherit; }
  .port-plan h3 { color: var(--brand); font-weight: bold; }
  .port-plan p, .port-plan dl { margin-block: 5px 12px; }
  .port-plan dl { display: grid; grid-template-columns: minmax(10ch, 1fr) minmax(0, 2.4fr); gap: 7px 12px; }
  .port-plan dt { overflow-wrap: anywhere; }
  .port-plan dd { color: var(--muted); }
  .exit-state { width: min(100%, var(--window-width)); margin: 0 auto; padding: 8px 10px; }
  .exit-state p { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="terminal-shell" id="terminal-shell" data-tab="proveo">
<header class="top">
  <div class="bar">
    <span class="brand"><span class="mark" aria-hidden="true">$</span> proveo</span>
    <nav class="tabs" role="tablist" aria-label="Dashboard">
      <button type="button" class="tab" id="tab-proveo" role="tab" aria-controls="proveo" aria-selected="true">proveo</button>
      <button type="button" class="tab" id="tab-sbx" role="tab" aria-controls="sbx" aria-selected="false" tabindex="-1">sbx</button>
    </nav>
    <span class="switch-hint" id="switch-hint"><kbd>Ctrl+G</kbd> <kbd>Tab</kbd> switch view</span>
  </div>
</header>

<main class="terminal-content" tabindex="0" aria-label="Terminal content">
  <section id="proveo" role="tabpanel" aria-labelledby="tab-proveo" data-mode="dashboard">
    <div class="workbar">
      <h1 id="view-title" hidden></h1>
      <p class="path" id="workspace-path">~/projects/proveo</p>
      <div class="layout-picker" role="group" aria-label="Proveo layout proposals">
        <button type="button" data-view="queue" aria-pressed="true"><kbd>1</kbd> Review queue</button>
        <button type="button" data-view="graph" aria-pressed="false"><kbd>2</kbd> Task graph</button>
        <button type="button" data-view="schedule" aria-pressed="false"><kbd>3</kbd> Schedule</button>
        <button type="button" data-view="combined" aria-pressed="false"><kbd>4</kbd> Combined panes</button>
      </div>
    </div>
    <div class="capacity-bar">
      <button type="button" class="button" id="capacity-key"><kbd>c</kbd> Host capacity</button>
      <div class="capacity-meters" id="capacity-meters"></div>
      <span class="kicker" id="capacity-summary"></span>
    </div>
    <div class="grid">
      <aside class="panel files" aria-labelledby="files-heading">
        <header class="panel-head">
          <h2 id="files-heading">Changes</h2>
          <button type="button" class="button" id="sidebar-swap"><kbd>f</kbd> Files</button>
        </header>
        <div class="panel-body">
          <div id="filetree">
            <div id="changes-tree"></div>
            <div id="workspace-tree" hidden></div>
            <div id="sandbox-tree" hidden></div>
          </div>
        </div>
      </aside>
      <section class="panel task-panel" id="task-panel" aria-label="Review queue">
        <header class="panel-head" id="work-toolbar">
          <span class="kicker" id="work-legend"></span>
          <div class="actions" id="task-controls"></div>
        </header>
        <div class="panel-body" id="work"></div>
      </section>
      <aside class="panel inspector" aria-labelledby="detail-heading">
        <header class="panel-head"><h2 id="detail-heading">Task details</h2><span class="kicker" id="detail-context"></span></header>
        <section class="sandbox-usage" id="sandbox-usage" aria-labelledby="sandbox-usage-heading">
          <header class="sandbox-usage-head">
            <h3 id="sandbox-usage-heading">Sandbox usage</h3>
            <span class="kicker" id="sandbox-usage-status"></span>
          </header>
          <dl class="sandbox-metrics">
            <div><dt>CPU</dt><dd id="sandbox-cpu"></dd></div>
            <div><dt>RAM</dt><dd id="sandbox-ram"></dd></div>
            <div><dt>Disk</dt><dd id="sandbox-disk"></dd></div>
          </dl>
        </section>
        <div class="panel-body" id="detail"></div>
      </aside>
    </div>
  </section>

  <section id="sbx" role="tabpanel" aria-labelledby="tab-sbx" hidden>
    <figure class="sbx-preview">
      <img src="sbx-dashboard.png" width="1480" height="882" alt="Docker Sandboxes terminal dashboard showing sandbox status, resource usage, and allowed and blocked network requests.">
    </figure>
  </section>
</main>
<footer class="footer">
  <button type="button" class="button" id="quit-key"><kbd>Ctrl+C</kbd> quit</button>
  <div class="keybar" id="dashboard-keys">
    <span class="subtext"><kbd>↑↓</kbd> move</span>
    <button type="button" class="button" id="enter-key" hidden><kbd>Enter</kbd> <span></span></button>
    <button type="button" class="button" id="fresh-key" hidden><kbd>e</kbd> Fresh</button>
    <button type="button" class="button" id="new-instance"><kbd>n</kbd> new instance</button>
    <button type="button" class="button" id="proposal-button"><kbd>?</kbd> help</button>
  </div>
  <div class="keybar" id="editor-keys">
    <button type="button" class="button" id="editor-back"><kbd>Esc</kbd> return to Proveo</button>
    <span class="subtext"><kbd>Enter</kbd> open file</span>
    <button type="button" class="button" id="patch-key" hidden><kbd>v</kbd> <span>Diff</span></button>
    <span class="subtext">Read-only file preview</span>
  </div>
  <button type="button" class="button" id="implementation-key"><kbd class="implementation-prefix">Ctrl+G</kbd> <kbd>i</kbd> implementation</button>
  <span class="toast" id="toast" role="status"></span>
  <span class="subtext footer-note" id="workspace-note">Sample workspace</span>
  <a class="subtext footer-note" id="sbx-source" href="https://docs.docker.com/ai/sandboxes/get-started/#whats-next">Docker’s sbx dashboard screenshot ↗</a>
</footer>
</div>

<section class="exit-state" id="exit-state" aria-label="Preview exit" hidden>
  <p role="status">Dashboard exited · status 130</p>
  <button type="button" class="button" id="restart-key"><kbd>Enter</kbd> restart preview</button>
</section>

<dialog id="dialog" aria-labelledby="dialog-title">
  <header class="panel-head">
    <h2 id="dialog-title"></h2>
    <form method="dialog"><button type="submit" class="button"><kbd>Esc</kbd> Close</button></form>
  </header>
  <div class="panel-body" id="dialog-body"></div>
</dialog>

<template id="implementation-details">
  <article class="port-plan">
    <h3>One model, three views</h3>
    <p class="subtext">Feed all four layouts from the same task, result, and schedule records. Combined panes stacks Changes above Task details on the left and gives the review queue the remaining columns. Keep the terminal frame fixed across layout switches and scroll vertically to reach the full details.</p>
    <p class="subtext">Build the Changes tree from each task’s Git base and last carried branch tip. Enter attaches to a running scheduled task or opens the selected file across the center and right panes. Use <kbd>v</kbd> to switch between the file and its diff.</p>
    <p class="subtext">New instance collects the agent, task, and initial prompt. The task inspector shows the original prompt recorded for that instance.</p>
    <h3>Resource admission</h3>
    <p class="subtext">A task starts when its prerequisites and CPU, RAM, and disk reservations fit. Use <kbd>c</kbd> to change the sample host. Quint models the transition rules and checks invariants outside the Go runtime. <a href="resource_queue.qnt">Quint model ↗</a></p>
    <h3>Task graph</h3>
    <p class="subtext">Render ordered dependency paths in terminal rows. Fold long runs into a task count. Keep direct blockers available with the task even when a path is folded.</p>
    <h3>Go libraries</h3>
    <dl>
      <dt><a href="https://pkg.go.dev/charm.land/bubbletea/v2">Bubble Tea v2</a></dt>
      <dd>Own the terminal, handle key and resize events, and keep the selected tab and view in one model. Use the version already in Proveo.</dd>
      <dt><a href="https://pkg.go.dev/charm.land/lipgloss/v2">Lip Gloss v2</a></dt>
      <dd>Compose the frame and panes with the existing terminal-cell drawing and semantic colors in <code>internal/ui</code>. <a href="https://github.com/proveo-ca/identity">Proveo identity ↗</a></dd>
      <dt><a href="https://pkg.go.dev/charm.land/bubbles/v2/help">Bubbles v2 key and help</a></dt>
      <dd>Draw the bottom key bar from the active bindings. Follow the sbx pattern with key first, action second, and commands that match the focused view.</dd>
      <dt><a href="https://pkg.go.dev/github.com/creack/pty">creack/pty</a> + <a href="https://pkg.go.dev/golang.org/x/term">x/term</a></dt>
      <dd>Reuse the existing Unix PTY and terminal primitives to run stock sbx at the content-pane size. Bubble Tea owns the outer terminal.</dd>
      <dt><a href="https://pkg.go.dev/github.com/charmbracelet/x/vt">Charm x/vt</a></dt>
      <dd>Candidate for the child screen buffer. Emulate sbx’s cursor, colors, alternate screen, and terminal replies inside the pane so the tab strip stays visible.</dd>
      <dt><a href="https://github.com/sinelaw/fresh">Fresh</a></dt>
      <dd>Use interactive <code>sbx exec</code> on the owning host to run <code>fresh .</code> in the selected sandbox’s guest workspace. Offer the binding when that sandbox is running and Fresh is available there. Restore task details when the editor exits.</dd>
    </dl>
    <h3>Interrupt and exit</h3>
    <p class="subtext">Proveo intercepts <kbd>Ctrl+C</kbd> before forwarding input to the visible child. It closes the dashboard-owned sbx client, restores the original terminal, and exits with status 130. Scheduled runs and existing sandboxes continue independently.</p>
    <p class="subtext">If sbx exits on its own, return to the Proveo view and show its status. The sbx pane never launches a shell as a fallback. The HTML preview demonstrates dashboard exit and offers a restart.</p>
  </article>
</template>

<script>
  "use strict"

  const phases = ["Spec", "Verification", "Spec revision", "Live verification", "Upgrade", "PR", "Review", "Merge"]
  const views = {
    queue: ["Review queue", ""],
    graph: ["Task graph", "prerequisite → dependent"],
    schedule: ["Schedule", "Local time"],
  }
  const taskStates = {
    review: ["Ready for review", "◇"],
    changes: ["Changes requested", "↶", "warn"],
    active: ["Running", "●"],
    reserved: ["Starting", "●", "active"],
    settling: ["Saving results", "◐", "active"],
    blocked: ["Needs attention", "!", "warn"],

  function dependencyError(id, path = new Set(), checked = new Set()) {
    if (path.has(id)) return "Dependency cycle at " + id
    if (!taskFor(id)) return "Unknown prerequisite " + id
    if (checked.has(id)) return ""
    path.add(id)
    for (const parent of dependencies[id] ?? []) {
      const error = dependencyError(parent, path, checked)
      if (error) return error
    }
    path.delete(id)
    checked.add(id)
    return ""
  }

  function available() {
    if (!host.free) return null
    const leases = tasks.filter(({state}) => workingStates.includes(state))
    return Object.fromEntries(dimensions.map(key => {
      const held = leases.reduce((total, task) => total + taskDemand[task.id][key], 0)
      const pending = leases.filter(task => !host.reflected.has(task.id))
        .reduce((total, task) => total + taskDemand[task.id][key], 0)
      return [key, Math.max(0, Math.min(pool[key] - held, host.free[key] - pending))]
    }))
  }

    const demand = taskDemand[task.id]

    const short = dimensions.filter(key => demand[key] > free[key])
    return short.length ? "Waiting for " + short.map(key => resourceLabels[key]).join(" · ") : ""
  }

    return true

      } else if (queueReason(task) || !transition(task, "admit")) {

      pending.splice(pending.indexOf(id), 1)
    }
  }

  function graphPath(id) {
    const path = []
    const seen = new Set()
    let next = id
    while (next && !seen.has(next)) {
      path.unshift(next)
      seen.add(next)
      next = dependencies[next]?.[0]
    }
    return {path, cycle: next}
  }

  function graphLane(path, cycle) {
    const row = node("div", "graph-row")
    const chain = node("div", "graph-chain")
    const append = item => {
      if (chain.childElementCount) chain.append(node("span", "subtext", "→"))
      chain.append(item)
    }
    const hidden = path.length > 4 ? path.slice(1, -2) : []
    if (hidden.length) {
      const details = node("div", "graph-chain")
      details.hidden = true
      hidden.forEach((id, index) => {
        if (index > 0) details.append(node("span", "subtext", "→"))
        details.append(graphNode(id))
      })
      const fold = button(hidden.length + " tasks", () => {
        details.hidden = !details.hidden
        fold.setAttribute("aria-expanded", String(!details.hidden))
        updateEnterHint()
      }, "button graph-fold")
      fold.setAttribute("aria-expanded", "false")
      append(graphNode(path[0]))
      append(fold)
      path.slice(-2).forEach(id => append(graphNode(id)))
      row.append(chain, details)
    } else {
      path.forEach(id => append(graphNode(id)))
      row.append(chain)
    }
    if (cycle) row.append(node("p", "graph-blockers", "Dependency cycle at " + cycle))
    return row
  }

  function taskGraph() {
    const graph = node("div")
    const parents = new Set(Object.values(dependencies).flat())
    const leaves = Object.keys(dependencies).filter(id => !parents.has(id))
    const paths = leaves.map(graphPath)
    const covered = new Set(paths.flatMap(({path}) => path))
    for (const id of Object.keys(dependencies)) {
      if (!covered.has(id)) {
        const path = graphPath(id)
        paths.push(path)
        path.path.forEach(parent => covered.add(parent))
      }
    }
    for (const {path, cycle} of paths) graph.append(graphLane(path, cycle))
    for (const [id, entries] of Object.entries(dependencies)) {
      for (const extra of entries.slice(1)) graph.append(graphLane([extra, id]))
    }
    const waiting = tasks.filter(task => task.state !== "merged")
      .map(task => [task.id, dependencyError(task.id), blockers(task)]).filter(([, error, open]) => error || open.length)
    if (waiting.length) {
      const list = node("section", "section graph-row")
      list.append(node("h3", "kicker", "Blockers"))
      for (const [id, error, open] of waiting) {
        list.append(node("p", "graph-blockers", error ? id + " · " + error : id + " waits for " + open.join(", ")))
      }
      graph.append(list)
    }
    const independent = tasks.filter(task => !dependencies[task.id] && !parents.has(task.id))
    if (independent.length) graph.append(taskGroup("Independent tasks", independent, "section graph-row"))
    return graph
  }

  function tree(entries, parent = "", source = "files") {

    const list = node("ul", "tree")

      const path = parent ? parent + "/" + name : name
      const item = node("li")

        group.open = source !== "files" || path.startsWith("_spec")
        group.append(node("summary", "", name), tree(value, path, source))
        item.append(group)
      } else {
        const entry = changes ? value : {name, path, value}
        if (source === "files") filesByPath.set(path, entry)
        const open = () => setEditor(entry, source)
        const file = button("", open, changes ? "file change-file" : "file")
        if (changes) {
          const mark = node("span", "change-status", entry.status)
          mark.dataset.status = entry.status
          file.append(mark)
        }
        file.append(clippedLabel(name, name.lastIndexOf(".")))
        file.dataset.path = path
        file.title = path
        bindEnter(file, "Open file", open)
        item.append(file)
      }
      list.append(item)
    }
    return list
  }

  function changeEntries(changes, tip) {
    const root = new Map()
    for (const [status, path, before, after, oldPath] of changes) {
      const parts = path.split("/")
      const name = parts.pop()
      let directory = root
      for (const part of parts) {
        if (!directory.has(part)) directory.set(part, new Map())
        directory = directory.get(part)
      }
      directory.set(name, {name, path, status, before, after, oldPath, tip, value: status === "D" ? before : after})
    }
    const entries = directory => [...directory].map(([name, entry]) => [name, entry instanceof Map ? entries(entry) : entry])
    return entries(root)
  }

  function renderChanges() {
    const {id, revision} = ui.task
    const changes = changesByTask[id] ?? []
    const pane = $("changes-tree")
    if (changes.length === 0) {
      pane.replaceChildren(node("p", "change-source", "No branch snapshot yet."))
      return
    }
    const count = changes.length + (changes.length === 1 ? " file" : " files")
    pane.replaceChildren(
      node("p", "change-source", "Carried · " + count + "\n" + sampleBase + "…" + revision),
      tree(changeEntries(changes, revision), "", "changes"),
    )
  }

  function sidebarMode() {
    return ui.editing ? ui.editorSidebar : ui.sidebar
  }

  function renderSidebar() {
    const mode = sidebarMode()
    const changes = mode === "changes"
    const sandbox = mode === "sandbox"
    $("files-heading").textContent = sandbox ? "Sandbox files" : changes ? "Changes" : "Files"
    $("workspace-tree").hidden = mode !== "files"
    $("changes-tree").hidden = !changes
    $("sandbox-tree").hidden = !sandbox
    $("sidebar-swap").hidden = sandbox
    $("sidebar-swap").replaceChildren(node("kbd", "", changes ? "f" : "d"), changes ? " Files" : " Changes")
    updateEnterHint()
  }

  function setSidebar(mode) {
    if (sidebarMode() === "sandbox") return
    if (ui.editing) ui.editorSidebar = mode
    else ui.sidebar = mode
    renderSidebar()
    if (ui.editing) renderInspector()
  }

  function selectedSandboxFiles() {
    return ui.task.state === "active" ? sandboxFileSamples[ui.task.instance] : undefined
  }

  function openSandboxFresh() {
    const files = selectedSandboxFiles()
    if (ui.editing || !files) return
    const pane = $("sandbox-tree")
    pane.replaceChildren(tree(files, "", "sandbox"))
    pane.querySelector(".file")?.click()
  }

  function setEditor(file = null, source = "files") {
    const open = Boolean(file)
    const wasSandbox = sidebarMode() === "sandbox"
    const sandbox = open && source === "sandbox"
    ui.editing = open
    ui.patch = false
    ui.editorFile = file
    ui.editorSidebar = source
    $("proveo").dataset.mode = open ? "editor" : "dashboard"
    $("terminal-shell").dataset.mode = $("proveo").dataset.mode
    $("view-title").hidden = !open
    if (sandbox) $("view-title").textContent = "Fresh · " + taskSandboxName(ui.task)
    else if (open) $("view-title").textContent = file.status ? "Review file" : "File preview"
    $("workspace-path").hidden = sandbox
    $("workspace-note").hidden = sandbox
    renderSidebar()
    renderInspector()
    if (open) $("detail-heading").focus()
    else $(wasSandbox && !$("fresh-key").hidden ? "fresh-key" : "sidebar-swap").focus()
  }

  function editorLines(file) {
    const lines = node("ol", "editor-lines")
    file.value.split("\n").forEach((text, index) => {
      const line = node("li")
      const number = node("span", "", String(index + 1))
      number.setAttribute("aria-hidden", "true")
      line.append(number, node("code", "", text))
      lines.append(line)
    })
    return lines
  }

  function patchView(file) {
    const before = file.status === "A" ? [] : file.before.split("\n")
    const after = file.status === "D" ? [] : file.after.split("\n")
    const lines = [
      "--- " + (file.status === "A" ? "/dev/null" : "a/" + (file.oldPath ?? file.path)),
      "+++ " + (file.status === "D" ? "/dev/null" : "b/" + file.path),
      "@@ -" + (before.length ? "1," + before.length : "0,0") + " +" + (after.length ? "1," + after.length : "0,0") + " @@",
      ...before.map(line => "-" + line),
      ...after.map(line => "+" + line),
    ]
    const patch = node("pre", "file-preview")
    lines.forEach((line, index) => {
      const tone = index <= 2 ? "" : line.startsWith("+") ? " patch-added" : " patch-removed"
      patch.append(node("span", "patch-line" + tone, line))
    })
    return patch
  }

  function togglePatch() {
    if (!ui.editing || !ui.editorFile.status) return
    ui.patch = !ui.patch
    renderInspector()
  }

  function fact(label, text) {
    const row = node("div", "fact")
    const value = node("dd")
    value.append(text)
    row.append(node("dt", "", label), value)
    return row
  }

  function showAttach(task) {
    selectTask(task)
    if (!canAttach(task)) {
      notify(task.id + " · no live run")
      return
    }
    showCommand("Attach · " + task.id, "Open the running job’s terminal. Detach with Ctrl+B, then d.", "proveo attach " + task.job)
  }

  function agentTarget(name) {
    return name === "Claude Code" ? "claudecode" : name.toLowerCase()
  }

  function sandboxName(target, task, suffix) {
    const agent = target === "claudecode" ? "claude" : target
    const label = task ? [task.id, task.slug].join("-").toLowerCase() : "adhoc"
    const room = 32 - agent.length - suffix.length - 2
    return [agent, label.slice(0, room).replace(/-+$/, ""), suffix].join("-")
  }

  function taskSandboxName(task) {
    if (task.instance === "New instance" || task.instance === "Archived") return ""
    return sandboxName(agentTarget(task.agent), task, task.instance.slice(-6))
  }

  function showNewInstance() {
    const draft = {agent: agentTarget(ui.task.agent), ticket: ui.task.id, prompt: ui.task.prompt ?? ""}
    showDialog("New instance")
    instanceSetup(draft)
  }

  function instanceSetup(draft) {
    const fields = node("div", "launch-fields")
    const harnessLabel = node("label", "", "Agent")
    const harness = node("select")
    for (const name of [...new Set(tasks.map(({agent}) => agent))]) {
      harness.add(new Option(name, agentTarget(name)))
    }
    harness.value = draft.agent
    harness.addEventListener("change", () => { draft.agent = harness.value })
    harnessLabel.append(harness)
    const ticketLabel = node("label", "", "Task")
    const ticket = node("select")
    ticket.add(new Option("No task", ""))
    for (const task of tasks) ticket.add(new Option(task.id + " · " + task.title, task.id))
    ticket.value = draft.ticket
    ticket.addEventListener("change", () => {
      draft.ticket = ticket.value
      draft.prompt = taskFor(draft.ticket)?.prompt ?? ""
    })
    ticketLabel.append(ticket)
    fields.append(harnessLabel, ticketLabel)
    $("dialog-body").replaceChildren(
      node("p", "kicker", "1 of 3 · Agent and task"),
      fields,
      button("Next · Initial prompt", () => instancePrompt(draft), "button primary"),
    )
    harness.focus()
  }

  function instancePrompt(draft) {
    const field = node("label", "prompt-field", "Initial prompt")
    const input = node("textarea")
    input.value = draft.prompt
    input.required = true
    input.addEventListener("input", () => {
      draft.prompt = input.value
      input.setCustomValidity("")
    })
    field.append(input)
    const review = () => {
      input.setCustomValidity(input.value.trim() ? "" : "Enter the initial prompt.")
      if (input.reportValidity()) instanceReview(draft)
    }
    input.addEventListener("keydown", event => {
      if (event.ctrlKey && event.key === "Enter") {
        event.preventDefault()
        review()
      }
    })
    const actions = node("div", "actions")
    actions.append(button("Back", () => instanceSetup(draft)), button("Ctrl+Enter · Review launch", review, "button primary"))
    $("dialog-body").replaceChildren(node("p", "kicker", "2 of 3 · Prompt"), field, actions)
    input.focus()
  }

  function instanceReview(draft) {
    const task = taskFor(draft.ticket)
    const command = "proveo run " + draft.agent + " --new" + (task ? " --task " + task.id : "")
    const back = button("Back", () => instancePrompt(draft))
    const actions = node("div", "actions")
    actions.append(back, button("Copy command", () => copyCommand(command)))
    $("dialog-body").replaceChildren(
      node("p", "kicker", "3 of 3 · Review launch"),
      node("p", "subtext", "Example sandbox · " + sandboxName(draft.agent, task, "8ec741")),
      promptDetails(draft.prompt),
      node("pre", "file-preview", command),
      actions,
    )
    back.focus()
  }

  function promptDetails(prompt) {
    const details = node("details", "initial-prompt")
    details.open = true
    const summary = node("summary", "", "Initial prompt")
    details.append(summary)
    if (prompt) {
      const cue = node("span", "kicker prompt-overflow", "↕ scroll")
      cue.hidden = true
      summary.append(cue)
      const frame = node("div", "file-preview")
      frame.append(node("pre", "", prompt))
      details.append(frame)
      requestAnimationFrame(() => updatePromptOverflow(details))
    } else {
      details.append(node("p", "subtext", "No initial prompt recorded."))
    }
    return details
  }

  function updatePromptOverflow(container) {
    const cue = container.querySelector(".prompt-overflow")
    if (!cue) return
    const preview = cue.closest(".initial-prompt").querySelector("pre")
    const scrollable = preview.clientHeight < preview.scrollHeight
    cue.hidden = !scrollable
    preview.tabIndex = scrollable ? 0 : -1
  }

  function queueRework(task) {
    if (!transition(task, "requeue")) return
    task.phase = 2
    renderQueueEvent()
    $("detail-heading").focus()
    notify(task.id + (task.state === "reserved" ? " · capacity reserved" : " · " + queueReason(task)))
  }

  function simulateRunEvent(task, event) {
    if (!transition(task, event)) return
    if (event === "start") task.job = task.job ?? task.slug
    renderQueueEvent()
    $("detail-heading").focus()
  }

  function renderTaskControls(task) {
    const controls = $("task-controls")
    const demo = {
      reserved: ["Simulate start", "start"],
      active: ["Simulate exit", "exit"],
      settling: ["Publish sample result", "publish"],
    }[task.state]
    if (task.state === "changes") controls.replaceChildren(button("Queue rework", () => queueRework(task)))
    else if (demo) controls.replaceChildren(button(demo[0], () => simulateRunEvent(task, demo[1])))
    else controls.replaceChildren()
  }

  function renderSandboxUsage() {
    $("sandbox-usage").hidden = ui.editing
    if (ui.editing) return

    const {instance, state} = ui.task
    const series = sandboxUsageSamples[instance]
    const reading = series?.readings[series.index]
    let caption = state === "reserved" ? "Sandbox starting" : "No sample"
    if (reading) caption = state === "active" ? "Sample · " + sandboxPollMs / 1000 + "s" : "Last sample"
    $("sandbox-usage-status").textContent = caption
    for (const key of dimensions) {
      $(`sandbox-${key}`).textContent = reading ? reading[key] + (key === "cpu" ? "%" : " GiB") : "—"
    }
  }

  function pollSandboxUsage() {
    if ($("proveo").hidden || ui.editing || ui.task.state !== "active") return
    const series = sandboxUsageSamples[ui.task.instance]
    if (!series) return
    series.index = (series.index + 1) % series.readings.length
    renderSandboxUsage()
  }

  function renderInspector() {
    renderSandboxUsage()
    updateEnterHint()
    $("fresh-key").hidden = !selectedSandboxFiles()
    const detail = $("detail")
    const file = ui.editing ? ui.editorFile : null
    for (const item of $("filetree").querySelectorAll(".file")) {
      if (file?.path === item.dataset.path && !item.closest("[hidden]")) item.setAttribute("aria-current", "true")
      else item.removeAttribute("aria-current")
    }
    $("patch-key").hidden = !file?.status
    $("patch-key").lastElementChild.textContent = ui.patch ? "File" : "Diff"
    if (ui.editing) {
      $("detail-heading").textContent = file.path
      let context = ui.editorSidebar === "sandbox" ? "Sample sandbox" : "Host workspace"
      if (file.status) context = ui.patch ? "Git diff" : file.status === "D" ? "Base " + sampleBase : "Tip " + file.tip
      $("detail-context").textContent = context
      detail.replaceChildren(ui.patch ? patchView(file) : editorLines(file))
      return
    }

    const task = ui.task
    renderTaskControls(task)
    $("detail-heading").textContent = "Task details"
    $("detail-context").textContent = (task.gitSource ?? workspaceGitSource) + " + " + task.source
    const facts = node("dl", "facts")
    facts.append(
      fact("Ticket", task.id),
      fact("Agent", task.agent),
      fact("Branch", clippedLabel(task.branch, task.branch.lastIndexOf("/"))),
      fact("Instance", clippedLabel(task.instance, task.instance.lastIndexOf("-"))),
    )
    const sandbox = taskSandboxName(task)
    if (sandbox) facts.append(fact("Sandbox", clippedLabel(sandbox, sandbox.lastIndexOf("-"))))
    if (task.pr) facts.append(fact("PR", task.pr))
    const demand = taskDemand[task.id]
    if (demand) facts.append(fact("Requested", demand.cpu + " CPU · " + demand.ram + " GiB RAM · " + demand.disk + " GiB disk"))
    if (task.plan) {
      const plan = button("", () => {
        setEditor(filesByPath.get(task.plan))
        $("detail-heading").focus()
      }, "file-link")
      plan.append(clippedLabel(task.plan, task.plan.lastIndexOf("/")))
      facts.append(fact("Plan", plan))
    }
    const lastPush = node("p", "subtext last-push", "Last pushed: ")
    if (task.lastPushed) {
      const time = node("time", "", task.lastPushed.replace("T", " "))
      time.dateTime = task.lastPushed
      lastPush.append(time)
    } else {
      lastPush.append("—")
    }
    detail.replaceChildren(
      node("h3", "", task.title), facts, node("p", "subtext task-excerpt", task.description), lastPush,
      promptDetails(task.prompt),
    )
  }

  function showDialog(title, ...body) {
    $("dialog-title").textContent = title
    $("dialog-body").replaceChildren(...body)
    $("dialog").showModal()
  }

  function showImplementation() {
    if ($("dialog").open) $("dialog").close()
    showDialog("Porting the dashboard to Proveo", $("implementation-details").content.cloneNode(true))
  }

  function quitDashboard() {
    if ($("dialog").open) $("dialog").close()
    clearInterval(sandboxUsageTimer)
    setTabPrefix(false)
    $("terminal-shell").hidden = true
    $("exit-state").hidden = false
    $("restart-key").focus()
  }

  function notify(message) {
    clearTimeout(toastTimer)
    $("toast").textContent = message
    toastTimer = setTimeout(() => { $("toast").textContent = "" }, 3500)
  }

  async function copyCommand(command) {
    try {
      await navigator.clipboard.writeText(command)
      notify("Command copied.")
    } catch {
      if ($("dialog").open) $("dialog").close()
      showDialog("Copy this command", node("pre", "file-preview", command))
    }
  }

  function showCommand(title, explanation, command) {
    showDialog(title,
      node("p", "subtext", explanation),
      node("pre", "file-preview", command),
      button("Copy command", () => copyCommand(command)),
    )
  }

  const tabs = [...document.querySelectorAll('[role="tab"]')]
  const viewport = document.querySelector(".terminal-content")
  const tabScroll = { proveo: [0, 0], sbx: [0, 0] }
  let tabPrefix = false
  let tabPrefixTimer

  function setTabPrefix(armed) {
    clearTimeout(tabPrefixTimer)
    tabPrefix = armed
    const hint = $("switch-hint")
    hint.dataset.armed = String(armed)
    if (armed) {
      hint.replaceChildren(node("kbd", "", "Tab"), " switch · ", node("kbd", "", "p"), " proveo · ", node("kbd", "", "s"), " sbx · ", node("kbd", "", "i"), " implementation")
      tabPrefixTimer = setTimeout(() => setTabPrefix(false), 2200)
    } else {
      hint.replaceChildren(
        node("kbd", "", "Ctrl+G"), " ", node("kbd", "", "Tab"),
        $("sbx").hidden ? " switch view" : " return to proveo",
      )
    }
  }

  function showTab(chosen, focus = false) {
    if ($("dialog").open) $("dialog").close()
    const previous = $("terminal-shell").dataset.tab
    const next = chosen.getAttribute("aria-controls")
    if (previous !== next) tabScroll[previous] = [viewport.scrollLeft, viewport.scrollTop]
    $("terminal-shell").dataset.tab = next
    for (const tab of tabs) {
      const selected = tab === chosen
      tab.setAttribute("aria-selected", String(selected))
      tab.tabIndex = selected ? 0 : -1
      $(tab.getAttribute("aria-controls")).hidden = !selected
    }
    if (previous !== next) viewport.scrollTo(...tabScroll[next])
    setTabPrefix(false)
    if (focus) chosen.focus()
  }

  for (const tab of tabs) {
    tab.addEventListener("click", () => showTab(tab))
    tab.addEventListener("keydown", (event) => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return
      event.preventDefault()
      const next = event.key === "Home" ? tabs[0] : event.key === "End" ? tabs.at(-1) : tabs.find((other) => other !== tab)
      showTab(next, true)
    })
  }

  for (const control of document.querySelectorAll("[data-view]")) {
    control.addEventListener("click", () => {
      ui.view = control.dataset.view
      renderWork()
    })
  }

  function moveTask(step) {
    hoveredRow = null
    const rows = [...$("work").querySelectorAll("[data-task]")].filter(row => row.getClientRects().length)
    const current = rows.findIndex(row => row.getAttribute("aria-pressed") === "true")
    const next = current < 0 ? (step > 0 ? 0 : rows.length - 1) : current + step
    const row = rows[next]
    if (row) {
      row.click()
      row.focus()
    }
  }

  document.addEventListener("keydown", event => {
    if (event.defaultPrevented || $("terminal-shell").hidden) return
    if (event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === "c") {
      event.preventDefault()
      quitDashboard()
      return
    }
    if (event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === "g") {
      event.preventDefault()
      setTabPrefix(!tabPrefix)
      return
    }
    if (tabPrefix) {
      if (event.key === "i") {
        event.preventDefault()
        setTabPrefix(false)
        showImplementation()
        return
      }
      const active = tabs.find(tab => tab.getAttribute("aria-selected") === "true")
      const next = {p: tabs[0], s: tabs[1], Tab: tabs.find(tab => tab !== active)}[event.key]
      if (next) {
        event.preventDefault()
        showTab(next)
        viewport.focus({preventScroll: true})
        return
      }
      setTabPrefix(false)
    }
    if ($("proveo").hidden || $("dialog").open || event.ctrlKey || event.metaKey || event.altKey) return
    if (event.target.closest?.("input, textarea, select, [contenteditable]")) return
    const link = event.target.closest?.("button, a, summary")
    const row = actionRow()
    if (event.key === "Enter" && (row || (!link && !ui.editing))) {
      event.preventDefault()
      enterAction(row)
      return
    }
    if (event.key === "d" || event.key === "f") {
      event.preventDefault()
      setSidebar(event.key === "d" ? "changes" : "files")
      return
    }
    if (event.key === "Escape" && ui.editing) {
      event.preventDefault()
      setEditor()
      return
    }
    if (ui.editing) {
      if (event.key === "v") togglePatch()
      return
    }
    const control = {"1": "[data-view=queue]", "2": "[data-view=graph]", "3": "[data-view=schedule]", "4": "[data-view=combined]", c: "#capacity-key", e: "#fresh-key", n: "#new-instance", i: "#implementation-key", "?": "#proposal-button"}[event.key]
    if (control) {
      event.preventDefault()
      document.querySelector(control).click()
    } else if ((event.key === "ArrowUp" || event.key === "ArrowDown") && !event.target.closest?.("#filetree, .initial-prompt pre")) {
      event.preventDefault()
      moveTask(event.key === "ArrowDown" ? 1 : -1)
    }
  })

  $("proposal-button").addEventListener("click", () => {
    const points = node("ul", "subtext")
    for (const text of [
      "Use pwd to find instances. Give each instance a stable ID and its own clone. Resume from that instance’s native session ID, even after rebuilding its VM.",
      "Checkpoint on managed exit and periodically when the harness allows it. A force-kill, deleted VM, or failed write can leave only the previous checkpoint.",
      "Verify OpenCode’s native JSON export and import in an sbx round trip before removing retained VMs. Give parallel Hermes instances separate homes for their databases and sockets.",
      "Use the review queue to see which jobs need attention, are working, or are waiting for capacity or prerequisites.",
      "Use the task graph to trace blockers and the schedule to see run history.",
    ]) points.append(node("li", "", text))
    showDialog("Workspace instance proposal", points, link("Read the lifecycle spec ↗", "workspace-instances.puml"))
  })
  $("fresh-key").addEventListener("click", openSandboxFresh)
  $("editor-back").addEventListener("click", () => setEditor())
  $("new-instance").addEventListener("click", showNewInstance)
  $("capacity-key").addEventListener("click", showCapacity)
  $("enter-key").addEventListener("click", () => enterAction())
  $("enter-key").addEventListener("blur", () => queueMicrotask(updateEnterHint))
  $("patch-key").addEventListener("click", togglePatch)
  $("sidebar-swap").addEventListener("click", () => setSidebar(sidebarMode() === "changes" ? "files" : "changes"))
  $("implementation-key").addEventListener("click", showImplementation)
  $("quit-key").addEventListener("click", quitDashboard)
  $("restart-key").addEventListener("click", () => location.reload())

  $("detail-heading").tabIndex = -1
  $("workspace-tree").append(tree(fileTree))
  renderChanges()
  renderSidebar()
  admitQueue()
  renderCapacity()
  renderWork()
  renderInspector()
  const promptResize = new ResizeObserver(entries => {
    for (const {target} of entries) updatePromptOverflow(target)
  })
  promptResize.observe($("detail"))
  promptResize.observe($("dialog-body"))
  const sandboxUsageTimer = setInterval(pollSandboxUsage, sandboxPollMs)
</script>
</body>
</html>
