<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Proveo Dashboard Proposal</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #062831;
    --surface: #0e3a48;
    --raised: #062831;
    --line: #1c5567;
    --text: #eaf5f3;
    --muted: #8fb9c2;
    --brand: #00bac6;
    --attention: #cbdb2a;
    --success: #009532;
    --ink: #181818;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --inset: 12px;
    --window-width: 1160px;
    --window-height: 810px;
    --canvas-width: 1100px;
    font: 14px/1.5 var(--mono);
    color: var(--text);
    background: var(--bg);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: var(--inset); }
  h1, h2, h3, p, ol, ul, dl, dd, pre { margin: 0; font: inherit; }
  button, select, code, kbd { font: inherit; }
  button { color: inherit; cursor: pointer; }
  summary { cursor: pointer; }
  a { color: var(--brand); text-underline-offset: 3px; }
  :focus-visible { outline: 1px solid var(--brand); outline-offset: -1px; }
  [hidden] { display: none !important; }
  .terminal-shell {
    display: flex;
    flex-direction: column;
    width: min(100%, var(--window-width));
    height: min(var(--window-height), calc(100dvh - 2 * var(--inset)));
    min-height: 110px;
    margin: 0 auto;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .terminal-content { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
  .terminal-content > [role="tabpanel"] { min-width: var(--canvas-width); min-height: 100%; }
  #proveo { display: flex; flex-direction: column; }
  #sbx { background: var(--bg); }
  .subtext, .kicker { color: var(--muted); }
  .kicker { font-size: .92rem; }
  .top { background: var(--raised); border-bottom: 1px solid var(--line); }
  .top, .footer { flex: none; overflow-x: auto; white-space: nowrap; }
  .bar, .workbar, .footer { display: flex; align-items: center; gap: 12px; padding: 5px 10px; }
  .bar { min-height: 38px; }
  .brand { font-weight: bold; white-space: nowrap; }
  .mark, .path { color: var(--brand); }
  .tabs, .layout-picker { display: flex; align-items: center; gap: 4px; }
  .tab, .layout-picker button, .button { border: 0; background: transparent; padding: 2px 6px; color: var(--muted); white-space: nowrap; }
  .tab:hover, .layout-picker button:hover, .button:hover { background: var(--raised); color: var(--text); }
  .tab[aria-selected="true"], .layout-picker button[aria-pressed="true"] { background: var(--brand); color: var(--ink); }
  .layout-picker button[aria-pressed="true"] kbd { color: inherit; }
  .tab[aria-selected="true"]::before { content: "["; }
  .tab[aria-selected="true"]::after { content: "]"; }
  .switch-hint { margin-left: auto; color: var(--muted); }
  .switch-hint[data-armed="true"] { color: var(--attention); }
  kbd { color: var(--brand); font-weight: bold; }
  .button { text-align: left; color: var(--text); }
  .button.primary { color: var(--brand); }
  .workbar { border-bottom: 1px solid var(--line); min-height: 36px; }
  .workbar h1 { font-weight: bold; }
  .path { overflow-wrap: anywhere; }
  .layout-picker { margin-left: auto; }
  .metrics { border-bottom: 1px solid var(--line); display: flex; gap: 4px 18px; flex-wrap: wrap; padding: 5px 10px; }
  .metric { display: flex; gap: .6ch; align-items: baseline; color: var(--muted); }
  .metric strong { color: var(--text); }
  .metric:first-child strong { color: var(--brand); }
  .grid { display: grid; flex: 1; grid-template-columns: minmax(170px, .58fr) minmax(0, 2fr) minmax(280px, 1.04fr); min-height: 540px; }
  .panel { min-width: 0; }
  .grid > .panel + .panel { border-left: 1px solid var(--line); }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line); background: var(--raised); }
  .panel-head h2 { min-width: 0; font-weight: bold; overflow-wrap: anywhere; }
  .panel-tools { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .panel-body { padding: 7px 10px; }
  .files .panel-body { padding: 5px 6px; }
  .tree { list-style: none; padding: 0; }
  .tree .tree { padding-left: .8ch; border-left: 1px solid var(--line); margin-left: 1ch; }
  .tree summary, .file { padding: 3px 5px; width: 100%; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree summary { color: var(--brand); }
  .file { background: transparent; border: 0; display: block; }
  .file::before { content: "·"; color: var(--muted); margin-right: 1ch; }
  .file:hover { background: var(--raised); }
  .file[aria-current="true"] { background: var(--brand); color: var(--ink); }
  .file[aria-current="true"]::before { color: inherit; }
  .section + .section { margin-top: 11px; }
  .section .kicker, .column .kicker { display: flex; align-items: center; gap: 1ch; margin: 0 0 4px; color: var(--brand); }
  .section .kicker::after, .column .kicker::after { content: ""; border-top: 1px solid var(--line); flex: 1; }
  .task { min-width: 0; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1ch; text-align: left; padding: 4px 5px 4px 2.6ch; position: relative; border: 0; border-bottom: 1px solid var(--line); background: transparent; }
  .task:last-child { border-bottom-color: transparent; }
  .task:hover { background: var(--raised); }
  .task[aria-pressed="true"] { background: var(--brand); color: var(--ink); }
  .task[aria-pressed="true"] :is(.task-meta, .state) { color: inherit; }
  .task[aria-pressed="true"]::before { content: "›"; position: absolute; left: .8ch; top: 4px; }
  .task-heading, .task-meta { display: block; overflow-wrap: anywhere; }
  .task-heading { font-weight: bold; }
  .task-meta { color: var(--muted); font-size: .88rem; }
  .state { display: inline-flex; align-items: baseline; gap: .6ch; color: var(--muted); font-size: .88rem; }
  .state.review, .state.active { color: var(--brand); }
  .state.saved { color: var(--text); }
  .state.saved > span { color: var(--success); }
  .state.warn { color: var(--attention); }
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: -7px -10px; }
  .column { min-width: 0; padding: 7px 8px; }
  .column + .column { border-left: 1px solid var(--line); }
  .column .task { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .empty { color: var(--muted); padding: 3px 0; }
  .slot { display: grid; grid-template-columns: 6ch minmax(0, 1fr); align-items: start; gap: 1ch; }
  .slot time { padding-top: 4px; color: var(--attention); }
  .inspector h3 { color: var(--brand); font-weight: bold; overflow-wrap: anywhere; }
  .inspector p + p, .inspector h3 + p { margin-top: 4px; }
  .facts { margin-block: 9px; }
  .fact { display: grid; grid-template-columns: 9ch minmax(0, 1fr); gap: 1ch; align-items: baseline; }
  .fact dt { color: var(--muted); }
  .fact dd { overflow-wrap: anywhere; }
  .file-link { border: 0; background: transparent; color: var(--brand); text-align: left; padding: 0; overflow-wrap: anywhere; }
  .file-link:hover { color: var(--text); }
  .phases { border-top: 1px solid var(--line); padding-top: 7px; }
  .phases ol { color: var(--muted); list-style: none; padding: 0; margin-block: 3px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; }
  .phase { padding: 2px; display: flex; gap: 4px; align-items: baseline; }
  .phase.complete { color: var(--text); }
  .phase[aria-current="step"] { color: var(--ink); background: var(--brand); }
  .evidence { margin-block: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .file-preview { margin-block: 8px; padding: 6px; background: var(--bg); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .editor-lines { list-style: none; margin-top: 7px; padding: 5px 0; color: var(--text); }
  .editor-lines li { display: grid; grid-template-columns: 5ch minmax(0, 1fr); }
  .editor-lines li > span { padding-right: 2ch; text-align: right; color: var(--muted); user-select: none; }
  .editor-lines code { white-space: pre-wrap; overflow-wrap: anywhere; }
  #proveo[data-mode="editor"] .grid { grid-template-columns: minmax(170px, .58fr) minmax(0, 3.04fr); }
  #proveo[data-mode="editor"] :is(.task-panel, .metrics, .layout-picker),
  #terminal-shell:not([data-mode="editor"]) #editor-keys,
  #terminal-shell[data-mode="editor"] #dashboard-keys,
  #terminal-shell[data-tab="sbx"] :is(#dashboard-keys, #editor-keys, #workspace-note),
  #terminal-shell[data-tab="proveo"] #sbx-source { display: none; }
  #terminal-shell[data-tab="proveo"]:not([data-mode="editor"]) .implementation-prefix { display: none; }
  .sbx-preview { margin: 0; }
  .sbx-preview img { display: block; width: 100%; height: auto; }
  .footer { background: var(--raised); border-top: 1px solid var(--line); min-height: 36px; }
  .keybar { display: flex; align-items: center; gap: 4px 9px; }
  .footer .button, .keybar, #sbx-source { flex: none; }
  .footer-note, .toast { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
  .toast { color: var(--brand); }
  .toast:empty { display: none; }
  .toast:not(:empty) + #workspace-note { display: none; }
  dialog { color: var(--text); background: var(--surface); padding: 0; border: 1px solid var(--brand); width: min(760px, calc(100% - 24px)); }
  dialog::backdrop { background: rgb(6 40 49 / 75%); }
  dialog .panel-body { padding: 10px; }
  dialog .panel-body > * + *, dialog li + li { margin-top: 8px; }
  .launch-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .launch-fields label { display: grid; gap: 4px; min-width: 0; color: var(--muted); }
  .launch-fields select { color: var(--text); background: var(--raised); width: 100%; border: 1px solid var(--line); border-radius: 0; padding: 4px; }
  .port-plan h3 { color: var(--brand); font-weight: bold; }
  .port-plan p, .port-plan dl { margin-block: 5px 12px; }
  .port-plan dl { display: grid; grid-template-columns: minmax(10ch, 1fr) minmax(0, 2.4fr); gap: 7px 12px; }
  .port-plan dt { overflow-wrap: anywhere; }
  .port-plan dd { color: var(--muted); }
  .exit-state { width: min(100%, var(--window-width)); margin: 0 auto; padding: 8px 10px; }
  .exit-state p { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="terminal-shell" id="terminal-shell" data-tab="proveo">
<header class="top">
  <div class="bar">
    <span class="brand"><span class="mark" aria-hidden="true">$</span> proveo</span>
    <nav class="tabs" role="tablist" aria-label="Dashboard">
      <button type="button" class="tab" id="tab-proveo" role="tab" aria-controls="proveo" aria-selected="true">proveo</button>
      <button type="button" class="tab" id="tab-sbx" role="tab" aria-controls="sbx" aria-selected="false" tabindex="-1">sbx</button>
    </nav>
    <span class="switch-hint" id="switch-hint"><kbd>Ctrl+G</kbd> <kbd>Tab</kbd> switch view</span>
  </div>
</header>

<main class="terminal-content" tabindex="0" aria-label="Terminal content">
  <section id="proveo" role="tabpanel" aria-labelledby="tab-proveo" data-mode="dashboard">
    <div class="workbar">
      <h1 id="view-title">Morning review</h1>
      <p class="path">~/projects/proveo</p>
      <div class="layout-picker" role="group" aria-label="Proveo layout proposals">
        <button type="button" data-view="queue" aria-pressed="true"><kbd>1</kbd> Review queue</button>
        <button type="button" data-view="board" aria-pressed="false"><kbd>2</kbd> Task board</button>
        <button type="button" data-view="schedule" aria-pressed="false"><kbd>3</kbd> Schedule</button>
      </div>
    </div>
    <div class="metrics" id="metrics" aria-label="Workspace summary"></div>
    <div class="grid">
      <aside class="panel files" aria-labelledby="files-heading">
        <header class="panel-head"><h2 id="files-heading">Files</h2><span class="kicker">pwd</span></header>
        <div class="panel-body">
          <div id="filetree"></div>
        </div>
      </aside>
      <section class="panel task-panel" aria-labelledby="work-heading">
        <header class="panel-head">
          <h2 id="work-heading">Review queue</h2>
          <div class="panel-tools">
            <span class="kicker" id="work-clock">Mon · 08:42 local</span>
          </div>
        </header>
        <div class="panel-body" id="work"></div>
      </section>
      <aside class="panel inspector" aria-labelledby="detail-heading">
        <header class="panel-head"><h2 id="detail-heading">Task details</h2><span class="kicker" id="detail-context">Linear</span></header>
        <div class="panel-body" id="detail"></div>
      </aside>
    </div>
  </section>

  <section id="sbx" role="tabpanel" aria-labelledby="tab-sbx" hidden>
    <figure class="sbx-preview">
      <img src="sbx-dashboard.png" width="1480" height="882" alt="Docker Sandboxes terminal dashboard showing sandbox status, resource usage, and allowed and blocked network requests.">
    </figure>
  </section>
</main>
<footer class="footer">
  <button type="button" class="button" id="quit-key"><kbd>Ctrl+C</kbd> quit</button>
  <div class="keybar" id="dashboard-keys">
    <span class="subtext"><kbd>↑↓</kbd> move</span>
    <button type="button" class="button" id="evidence-key"><kbd>Enter</kbd> evidence</button>
    <button type="button" class="button" id="fresh-key"><kbd>e</kbd> Fresh</button>
    <button type="button" class="button" id="new-instance"><kbd>n</kbd> new instance</button>
    <button type="button" class="button" id="proposal-button"><kbd>?</kbd> help</button>
  </div>
  <div class="keybar" id="editor-keys">
    <button type="button" class="button" id="editor-back"><kbd>Esc</kbd> return to Proveo</button>
    <span class="subtext">Read-only file preview</span>
  </div>
  <button type="button" class="button" id="implementation-key"><kbd class="implementation-prefix">Ctrl+G</kbd> <kbd>i</kbd> implementation</button>
  <span class="toast" id="toast" role="status"></span>
  <span class="subtext footer-note" id="workspace-note">Sample workspace · 22:00–06:00 local</span>
  <a class="subtext footer-note" id="sbx-source" href="https://docs.docker.com/ai/sandboxes/get-started/#whats-next">Docker’s sbx dashboard screenshot ↗</a>
</footer>
</div>

<section class="exit-state" id="exit-state" aria-label="Preview exit" hidden>
  <p role="status">Dashboard exited · status 130</p>
  <button type="button" class="button" id="restart-key"><kbd>Enter</kbd> restart preview</button>
</section>

<dialog id="dialog" aria-labelledby="dialog-title">
  <header class="panel-head">
    <h2 id="dialog-title"></h2>
    <form method="dialog"><button type="submit" class="button"><kbd>Esc</kbd> Close</button></form>
  </header>
  <div class="panel-body" id="dialog-body"></div>
</dialog>

<template id="implementation-details">
  <article class="port-plan">
    <h3>One model, three views</h3>
    <p class="subtext">Port the Review queue, Task board, and Schedule as three views of one workspace model. Feed all three from the same task, result, and schedule records. Keep pane geometry across view switches and scroll task rows inside the frame.</p>
    <h3>Go libraries</h3>
    <dl>
      <dt><a href="https://pkg.go.dev/charm.land/bubbletea/v2">Bubble Tea v2</a></dt>
      <dd>Own the terminal, handle key and resize events, and keep the selected tab and view in one model. Use the version already in Proveo.</dd>
      <dt><a href="https://pkg.go.dev/charm.land/lipgloss/v2">Lip Gloss v2</a></dt>
      <dd>Compose the frame and panes with the existing terminal-cell drawing and semantic colors in <code>internal/ui</code>. <a href="https://github.com/proveo-ca/identity">Proveo identity ↗</a></dd>
      <dt><a href="https://pkg.go.dev/charm.land/bubbles/v2/help">Bubbles v2 key and help</a></dt>
      <dd>Draw the bottom key bar from the active bindings. Follow the sbx pattern with key first, action second, and commands that match the focused view.</dd>
      <dt><a href="https://pkg.go.dev/github.com/creack/pty">creack/pty</a> + <a href="https://pkg.go.dev/golang.org/x/term">x/term</a></dt>
      <dd>Reuse the existing Unix PTY and terminal primitives to run stock sbx at the content-pane size. Bubble Tea owns the outer terminal.</dd>
      <dt><a href="https://pkg.go.dev/github.com/charmbracelet/x/vt">Charm x/vt</a></dt>
      <dd>Candidate for the child screen buffer. Emulate sbx’s cursor, colors, alternate screen, and terminal replies inside the pane so the tab strip stays visible.</dd>
      <dt><a href="https://github.com/sinelaw/fresh">Fresh</a></dt>
      <dd>Launch the editor with <code>fresh .</code> through Bubble Tea’s terminal handoff. Restore the selected workspace view when the editor exits.</dd>
    </dl>
    <h3>Interrupt and exit</h3>
    <p class="subtext">Proveo intercepts <kbd>Ctrl+C</kbd> before forwarding input to the visible child. It closes the dashboard-owned sbx client, restores the original terminal, and exits with status 130. Scheduled runs and existing sandboxes continue independently.</p>
    <p class="subtext">If sbx exits on its own, return to the Proveo view and show its status. The sbx pane never launches a shell as a fallback. The HTML preview demonstrates dashboard exit and offers a restart.</p>
  </article>
</template>

<script>
  "use strict"

  const phases = ["Spec", "Verification", "Spec revision", "Live verification", "Upgrade", "PR", "Review", "Merge"]
  const views = {
    queue: ["Morning review", "Review queue", "Mon · 08:42 local"],
    board: ["Task board", "Tasks by stage", "7 sample tasks"],
    schedule: ["Night schedule", "Run timeline", "Local time"],
  }
  const taskStates = {
    review: ["Ready for review", "◇"],
    changes: ["Changes requested", "↶", "warn"],
    active: ["Running", "●"],
    blocked: ["Needs attention", "!", "warn"],

    merged: ["Merged", "✓", "saved"],
  }
  const tasks = [

      branch: "proveo/plan-21/session-index", session: "Awaiting first run", saved: false,
      summary: "Draft the query that lists resumable instances in the current workspace.",
      evidence: ["Plan · _spec/_plans/session-index.puml", "Schedule · 45 minute budget"],
    },
    {
      id: "PRV-304", slug: "evidence", title: "Bind evidence to the review revision", agent: "Claude Code", source: "Linear",
      phase: 4, state: "queued", time: "23:30", instance: "claude-08a532", revision: "5b119c9",
      branch: "proveo/prv-304/review-evidence", session: "Checkpoint saved", saved: true,
      summary: "Apply the verified upgrade and lift the new commit for review.",
      evidence: ["Unit suite · previous attempt passed", "Live verification · recorded against this revision", "Schedule · 75 minute budget"],
    },
    {
      id: "PRV-278", slug: "output", title: "Keep clone output per attempt", agent: "Codex", source: "Linear",
      phase: 7, state: "merged", time: "Yesterday", instance: "codex-411def", revision: "c0e6b81", pr: "Merged #98",
      branch: "proveo/prv-278/clone-output", session: "Checkpoint saved", saved: true,
      summary: "Merged after the reviewer verified that each attempt keeps its own output.",
      evidence: ["Unit suite · passed", "Live verification · passed", "PR · merged against the verified revision"],
    },
  ]
  const fileTree = [
    ["_spec", [
      ["_experiments", [
        ["dashboard", [
          ["workspace-instances.puml", "Proposed instance lifecycle\n\npwd → workspace\ninstance ID → isolated clone + native history\nattempt ID → checkpoint + Git result\n\nOne active writer per native session."],
        ]],
      ]],
      ["_plans", [
        ["night-budget.puml", "Night budget\n\nAllow time for a final checkpoint.\nRecord requested stops and final export results."],
        ["session-index.puml", "Session index\n\nReturn instances for the effective pwd.\nResume by instance and native session ID."],
      ]],
    ]],
    ["internal", [
      ["backend", [["sandbox.go", "Lifecycle entry point\n\nResolve the sandbox, start the agent, then carry results during teardown."]]],
      ["schedule", [["runner.go", "Run a scheduled attempt with a time budget.\nKeep the result, transcript, and report."]]],
    ]],
    ["defs", [["README.md", "Definitions use the effective working directory for project-scoped defaults."]]],
    ["README.md", "Proveo runs coding agents in Docker Sandboxes.\nBrowse proposals under _spec/."],
  ]

  const $ = (id) => document.getElementById(id)
  const ui = { view: "queue", task: tasks[0], file: null, editing: false, editorFile: null }
  const filesByPath = new Map()
  let toastTimer

  function node(tag, className, content) {
    const element = document.createElement(tag)
    if (className) element.className = className
    if (content) element.textContent = content
    return element
  }

  function button(text, action, className = "button clear") {
    const element = node("button", className, text)
    element.type = "button"
    element.addEventListener("click", action)
    return element
  }

  function link(text, href) {
    const element = node("a", "", text)
    element.href = href
    return element
  }

  function status(text, icon, kind) {
    const element = node("span", "state " + kind)
    const symbol = node("span", "", icon)
    symbol.setAttribute("aria-hidden", "true")
    element.append(symbol, document.createTextNode(text))
    return element
  }

  function metric(label, count) {
    const display = node("div", "metric")
    display.append(node("strong", "", String(count)), node("span", "", label))
    return display
  }

  function renderMetrics() {
    const counts = [
      ["Needs review", tasks.filter(({state}) => ["review", "changes"].includes(state)).length],
      ["Running", tasks.filter(({state}) => state === "active").length],
      ["Needs attention", tasks.filter(({state}) => state === "blocked").length],
      ["Queued tonight", tasks.filter(({state}) => state === "queued").length],
    ]
    $("metrics").replaceChildren(...counts.map(([label, count]) => metric(label, count)))
  }

  function selectTask(task) {
    ui.task = task
    ui.file = null
    for (const item of $("work").querySelectorAll(".task")) {
      item.setAttribute("aria-pressed", String(item.dataset.task === task.id))
    }
    renderInspector()
  }

  function taskCard(task) {
    const card = button("", () => selectTask(task), "task")
    card.dataset.task = task.id
    card.setAttribute("aria-pressed", String(!ui.file && task === ui.task))
    const name = node("span")
    name.append(
      node("span", "task-heading", task.title),
      node("span", "task-meta", [task.id, task.agent, phases[task.phase]].join(" · ")),
    )
    const [label, icon, kind = task.state] = taskStates[task.state]
    card.append(name, status(label, icon, kind))
    return card
  }

  function taskGroup(title, items, variant = "section", withTime = false) {
    const section = node("section", variant)
    section.append(node("h3", "kicker", title))
    if (items.length === 0) {
      section.append(node("p", "empty", "No tasks"))
      return section
    }
    const list = node("div", "tasks")
    for (const task of items) {
      const card = taskCard(task)
      if (withTime) {
        const slot = node("div", "slot")
        slot.append(node("time", "", task.time), card)
        list.append(slot)
      } else {
        list.append(card)
      }
    }
    section.append(list)
    return section
  }

  function renderWork() {
    const [title, heading, clock] = views[ui.view]
    $("view-title").textContent = ui.editing ? "$ fresh ." : title
    $("work-heading").textContent = heading
    for (const control of document.querySelectorAll("[data-view]")) {
      control.setAttribute("aria-pressed", String(control.dataset.view === ui.view))
    }

    const work = $("work")
    switch (ui.view) {
      case "queue":
        work.replaceChildren(
          taskGroup("Review this morning", tasks.filter(({state}) => ["review", "changes"].includes(state))),
          taskGroup("Follow up", tasks.filter(({state}) => ["active", "blocked"].includes(state))),
          taskGroup("Queued tonight", tasks.filter(({state}) => state === "queued")),
        )
        break
      case "board": {
        const board = node("div", "board")
        board.append(
          taskGroup("Spec and verify", tasks.filter(({phase}) => phase < 4), "column"),
          taskGroup("Upgrade and PR", tasks.filter(({phase}) => phase === 4 || phase === 5), "column"),
          taskGroup("Review and merge", tasks.filter(({phase}) => phase > 5), "column"),
        )
        work.replaceChildren(board)
        break
      }
      case "schedule": {
        const sort = (items) => items.sort((a, b) => a.time.localeCompare(b.time))
        work.replaceChildren(
          taskGroup("Last night · outcomes", sort(tasks.filter(({state}) => ["review", "changes", "blocked"].includes(state))), "section", true),
          taskGroup("Today · in progress", tasks.filter(({state}) => state === "active"), "section", true),
          taskGroup("Tonight · scheduled starts", sort(tasks.filter(({state}) => state === "queued")), "section", true),
        )
        break
      }
    }
    $("work-clock").textContent = clock
  }

  function tree(entries, parent = "") {
    const list = node("ul", "tree")
    for (const [name, value] of entries) {
      const path = parent ? parent + "/" + name : name
      const item = node("li")
      if (Array.isArray(value)) {
        const group = node("details")
        group.open = path.startsWith("_spec")
        group.append(node("summary", "", name), tree(value, path))
        item.append(group)
      } else {
        const entry = {name, path, value}
        filesByPath.set(path, entry)
        const file = button(name, () => selectFile(entry), "file")
        file.dataset.path = path
        file.title = path
        item.append(file)
      }
      list.append(item)
    }
    return list
  }

  function selectFile(file) {
    if (ui.editing) ui.editorFile = file
    else {
      ui.file = file
      for (const task of $("work").querySelectorAll(".task")) task.setAttribute("aria-pressed", "false")
    }
    renderInspector()
  }

  function setEditor(open) {
    ui.editing = open
    if (open) ui.editorFile = ui.file ?? ui.editorFile ?? filesByPath.get("README.md")
    $("proveo").dataset.mode = open ? "editor" : "dashboard"
    $("terminal-shell").dataset.mode = $("proveo").dataset.mode
    $("view-title").textContent = open ? "$ fresh ." : views[ui.view][0]
    renderInspector()
    if (open) $("detail-heading").focus()
    else $("fresh-key").focus()
  }

  function editorLines(file) {
    const lines = node("ol", "editor-lines")
    file.value.split("\n").forEach((text, index) => {
      const line = node("li")
      const number = node("span", "", String(index + 1))
      number.setAttribute("aria-hidden", "true")
      line.append(number, node("code", "", text))
      lines.append(line)
    })
    return lines
  }

  function fact(label, text) {
    const row = node("div", "fact")
    const value = node("dd")
    value.append(text)
    row.append(node("dt", "", label), value)
    return row
  }

  function phaseList(task) {
    const region = node("div", "phases")
    const list = node("ol")
    phases.forEach((phase, index) => {
      const item = node("li", index < task.phase ? "phase complete" : "phase")
      const glyph = node("span", "", index < task.phase ? "✓" : index === task.phase ? "→" : "·")
      glyph.setAttribute("aria-hidden", "true")
      item.append(glyph, document.createTextNode(phase))
      if (index === task.phase) item.setAttribute("aria-current", "step")
      list.append(item)
    })
    region.append(node("p", "kicker", "Workflow"), list, node("p", "subtext", "↶ Verification and review can return a task to the spec."))
    return region
  }

  function showEvidence(task) {
    const list = node("ul", "subtext")
    for (const entry of task.evidence) list.append(node("li", "", entry))
    showDialog("Evidence · " + task.id,
      node("p", "subtext", "Sample evidence for revision " + task.revision),
      list,
      node("p", "subtext", "A revised commit reopens the affected verification steps."),
    )
  }

  function showResume(task) {
    const command = "proveo run " + agentTarget(task.agent) + " --instance " + task.instance
    showCommand("Resume " + task.instance, "This proposed command selects the instance and restores its last saved native session.", command)
  }

  function agentTarget(name) {
    return name === "Claude Code" ? "claudecode" : name.toLowerCase()
  }

  function sandboxName(target, task, suffix) {
    const agent = target === "claudecode" ? "claude" : target
    const label = task ? [task.id, task.slug].join("-").toLowerCase() : "adhoc"
    const room = 32 - agent.length - suffix.length - 2
    return [agent, label.slice(0, room).replace(/-+$/, ""), suffix].join("-")
  }

  function showNewInstance() {
    const fields = node("div", "launch-fields")
    const harnessLabel = node("label", "", "Agent")
    const harness = node("select")
    for (const name of [...new Set(tasks.map(({agent}) => agent))]) {
      harness.add(new Option(name, agentTarget(name)))
    }
    harness.value = agentTarget(ui.task.agent)
    harnessLabel.append(harness)
    const ticketLabel = node("label", "", "Task")
    const ticket = node("select")
    ticket.add(new Option("No task", ""))
    for (const task of tasks) ticket.add(new Option(task.id + " · " + task.title, task.id))
    ticket.value = ui.task.id
    ticketLabel.append(ticket)
    fields.append(harnessLabel, ticketLabel)
    const name = node("p", "subtext")
    const command = node("pre", "file-preview")
    const update = () => {
      const task = tasks.find(({id}) => id === ticket.value)
      name.textContent = "Example sandbox · " + sandboxName(harness.value, task, "8ec741")
      command.textContent = "proveo run " + harness.value + " --new" + (ticket.value ? " --task " + ticket.value : "")
    }
    fields.addEventListener("change", update)
    update()
    showDialog("New instance in this pwd",
      node("p", "subtext", "This proposed command creates a separate clone and session in the current workspace."),
      fields, name, command, button("Copy command", () => copyCommand(command.textContent)),
    )
  }

  function queueRework(task) {
    task.state = "queued"
    task.phase = 2
    task.time = "22:30"
    renderMetrics()
    renderWork()
    renderInspector()
    $("detail-heading").focus()
    notify(task.id + " queued · 22:30")
  }

  function renderInspector() {
    const detail = $("detail")
    const file = ui.editing ? ui.editorFile : ui.file
    for (const item of $("filetree").querySelectorAll(".file")) {
      if (file?.path === item.dataset.path) item.setAttribute("aria-current", "true")
      else item.removeAttribute("aria-current")
    }
    if (ui.editing) {
      $("detail-heading").textContent = file.path
      $("detail-context").textContent = "Fresh preview"
      detail.replaceChildren(editorLines(file))
      return
    }
    if (file) {
      $("detail-heading").textContent = "File preview"
      $("detail-context").textContent = "Sample file"
      detail.replaceChildren(
        node("h3", "", file.name),
        node("p", "subtext", file.path),
        node("pre", "file-preview", file.value),
        button("Back to task", () => selectTask(ui.task)),
      )
      return
    }

    const task = ui.task
    $("detail-heading").textContent = "Task details"
    $("detail-context").textContent = task.source
    const facts = node("dl", "facts")
    facts.append(
      fact("Ticket", task.id),
      fact("Agent", task.agent),
      fact("Branch", task.branch),
      fact("Instance", task.instance),
    )
    if (task.instance !== "New instance") {
      facts.append(fact("Sandbox", sandboxName(agentTarget(task.agent), task, task.instance.slice(-6))))
    }
    if (task.plan) {
      facts.append(fact("Plan", button(task.plan, () => {
        selectFile(filesByPath.get(task.plan))
        $("detail-heading").focus()
      }, "file-link")))
    }
    if (task.pr) facts.append(fact("PR", task.pr))
    const evidence = node("div", "evidence")
    evidence.append(
      status(task.session, task.saved ? "✓" : task.state === "blocked" ? "!" : "○", task.saved ? "saved" : task.state === "blocked" ? "warn" : ""),
      node("p", "subtext", "Evidence · " + task.revision),
    )
    const actions = node("div", "actions")
    actions.append(button("Review evidence", () => showEvidence(task), "button primary"))
    if (task.state === "changes") actions.append(button("Queue rework", () => queueRework(task)))
    else if (task.saved) actions.append(button("Resume instance", () => showResume(task)))
    detail.replaceChildren(node("h3", "", task.title), node("p", "subtext", task.summary), facts, phaseList(task), evidence, actions)
  }

  function showDialog(title, ...body) {
    $("dialog-title").textContent = title
    $("dialog-body").replaceChildren(...body)
    $("dialog").showModal()
  }

  function showImplementation() {
    if ($("dialog").open) $("dialog").close()
    showDialog("Porting the dashboard to Proveo", $("implementation-details").content.cloneNode(true))
  }

  function quitDashboard() {
    if ($("dialog").open) $("dialog").close()
    setTabPrefix(false)
    $("terminal-shell").hidden = true
    $("exit-state").hidden = false
    $("restart-key").focus()
  }

  function notify(message) {
    clearTimeout(toastTimer)
    $("toast").textContent = message
    toastTimer = setTimeout(() => { $("toast").textContent = "" }, 3500)
  }

  async function copyCommand(command) {
    try {
      await navigator.clipboard.writeText(command)
      notify("Command copied.")
    } catch {
      if ($("dialog").open) $("dialog").close()
      showDialog("Copy this command", node("pre", "file-preview", command))
    }
  }

  function showCommand(title, explanation, command) {
    showDialog(title,
      node("p", "subtext", explanation),
      node("pre", "file-preview", command),
      button("Copy command", () => copyCommand(command)),
    )
  }

  const tabs = [...document.querySelectorAll('[role="tab"]')]
  const viewport = document.querySelector(".terminal-content")
  const tabScroll = { proveo: [0, 0], sbx: [0, 0] }
  let tabPrefix = false
  let tabPrefixTimer

  function setTabPrefix(armed) {
    clearTimeout(tabPrefixTimer)
    tabPrefix = armed
    const hint = $("switch-hint")
    hint.dataset.armed = String(armed)
    if (armed) {
      hint.replaceChildren(node("kbd", "", "Tab"), " switch · ", node("kbd", "", "p"), " proveo · ", node("kbd", "", "s"), " sbx · ", node("kbd", "", "i"), " implementation")
      tabPrefixTimer = setTimeout(() => setTabPrefix(false), 2200)
    } else {
      hint.replaceChildren(
        node("kbd", "", "Ctrl+G"), " ", node("kbd", "", "Tab"),
        $("sbx").hidden ? " switch view" : " return to proveo",
      )
    }
  }

  function showTab(chosen, focus = false) {
    if ($("dialog").open) $("dialog").close()
    const previous = $("terminal-shell").dataset.tab
    const next = chosen.getAttribute("aria-controls")
    if (previous !== next) tabScroll[previous] = [viewport.scrollLeft, viewport.scrollTop]
    $("terminal-shell").dataset.tab = next
    for (const tab of tabs) {
      const selected = tab === chosen
      tab.setAttribute("aria-selected", String(selected))
      tab.tabIndex = selected ? 0 : -1
      $(tab.getAttribute("aria-controls")).hidden = !selected
    }
    if (previous !== next) viewport.scrollTo(...tabScroll[next])
    setTabPrefix(false)
    if (focus) chosen.focus()
  }

  for (const tab of tabs) {
    tab.addEventListener("click", () => showTab(tab))
    tab.addEventListener("keydown", (event) => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return
      event.preventDefault()
      const next = event.key === "Home" ? tabs[0] : event.key === "End" ? tabs.at(-1) : tabs.find((other) => other !== tab)
      showTab(next, true)
    })
  }

  for (const control of document.querySelectorAll("[data-view]")) {
    control.addEventListener("click", () => {
      ui.view = control.dataset.view
      renderWork()
    })
  }

  function moveTask(step) {
    const rows = [...$("work").querySelectorAll(".task")]
    const current = rows.findIndex(row => row.getAttribute("aria-pressed") === "true")
    const next = current < 0 ? (step > 0 ? 0 : rows.length - 1) : current + step
    const row = rows[next]
    if (row) {
      row.click()
      row.focus()
    }
  }

  document.addEventListener("keydown", event => {
    if (event.defaultPrevented || $("terminal-shell").hidden) return
    if (event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === "c") {
      event.preventDefault()
      quitDashboard()
      return
    }
    if (event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === "g") {
      event.preventDefault()
      setTabPrefix(!tabPrefix)
      return
    }
    if (tabPrefix) {
      if (event.key === "i") {
        event.preventDefault()
        setTabPrefix(false)
        showImplementation()
        return
      }
      const active = tabs.find(tab => tab.getAttribute("aria-selected") === "true")
      const next = {p: tabs[0], s: tabs[1], Tab: tabs.find(tab => tab !== active)}[event.key]
      if (next) {
        event.preventDefault()
        showTab(next)
        viewport.focus({preventScroll: true})
        return
      }
      setTabPrefix(false)
    }
    if ($("proveo").hidden || $("dialog").open || event.ctrlKey || event.metaKey || event.altKey) return
    if (event.target.closest?.("input, textarea, select, [contenteditable]")) return
    if (event.key === "Escape" && ui.editing) {
      event.preventDefault()
      setEditor(false)
      return
    }
    if (ui.editing) return
    const control = {"1": "[data-view=queue]", "2": "[data-view=board]", "3": "[data-view=schedule]", e: "#fresh-key", n: "#new-instance", i: "#implementation-key", "?": "#proposal-button"}[event.key]
    if (control) {
      event.preventDefault()
      document.querySelector(control).click()
    } else if (event.key === "Enter" && (event.target.closest?.(".task") || !event.target.closest?.("button, a, summary"))) {
      event.preventDefault()
      showEvidence(ui.task)
    } else if ((event.key === "ArrowUp" || event.key === "ArrowDown") && !event.target.closest?.("#filetree")) {
      event.preventDefault()
      moveTask(event.key === "ArrowDown" ? 1 : -1)
    }
  })

  $("proposal-button").addEventListener("click", () => {
    const points = node("ul", "subtext")
    for (const text of [
      "Use pwd to find instances. Give each instance a stable ID and its own clone. Resume from that instance’s native session ID, even after rebuilding its VM.",
      "Checkpoint on managed exit and periodically when the harness allows it. A force-kill, deleted VM, or failed write can leave only the previous checkpoint.",
      "Verify OpenCode’s native JSON export and import in an sbx round trip before removing retained VMs. Give parallel Hermes instances separate homes for their databases and sockets.",
      "Let agents run scheduled tasks at night. Review the tested revision, evidence, and ticket in the morning.",
      "Start with the review queue. Use the task board to check ownership and the schedule to check overnight capacity.",
    ]) points.append(node("li", "", text))
    showDialog("Workspace instance proposal", points, link("Read the lifecycle spec ↗", "workspace-instances.puml"))
  })
  $("fresh-key").addEventListener("click", () => setEditor(true))
  $("editor-back").addEventListener("click", () => setEditor(false))
  $("new-instance").addEventListener("click", showNewInstance)
  $("evidence-key").addEventListener("click", () => showEvidence(ui.task))
  $("implementation-key").addEventListener("click", showImplementation)
  $("quit-key").addEventListener("click", quitDashboard)
  $("restart-key").addEventListener("click", () => location.reload())

  $("detail-heading").tabIndex = -1
  $("filetree").append(tree(fileTree))
  renderMetrics()
  renderWork()
  renderInspector()
</script>
</body>
</html>
